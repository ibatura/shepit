name: Release

# A merge into main that raises the version in Info.plist makes its tag and GitHub release, with the notes in
# docs/releases/<version>.md (or GitHub's list of merged pull requests when there are none). No third-party actions.
on:
  push:
    branches: [main]
    paths: [app/Resources/Info.plist]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Tag and release the version in Info.plist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          raw() { gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/$1?ref=$GITHUB_SHA"; }
          version=$(raw app/Resources/Info.plist | python3 -c 'import plistlib, sys; print(plistlib.loads(sys.stdin.buffer.read())["CFBundleShortVersionString"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version: $version" >&2; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          if raw "docs/releases/$version.md" > notes.md 2>/dev/null; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "Shepit $version" "${notes[@]}"
